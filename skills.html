<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude skills and plugins, ranked by stars</title>
  <meta name="description" content="Every plugin and skill in the Claude plugin directory, ranked by GitHub stars and filterable by tag.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Bruno<b>Fitas</b></a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="skills.html" aria-current="page">Claude skills</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <button class="theme-btn" type="button" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap skills">
    <aside class="rail" id="rail" aria-label="Filters">
      <div class="handle"></div>
      <h2>Claude skills</h2>
      <p class="intro" id="meta">Loading the directory...</p>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search by name, repo or topic" autocomplete="off">
      </label>
      <select id="sort" class="sort" aria-label="Sort order">
        <option value="stars">Most stars first</option>
        <option value="updated">Recently updated first</option>
        <option value="name">Name, A to Z</option>
      </select>
      <div class="facets" id="facets"></div>
      <button class="clear" id="clear" type="button" hidden>Clear all filters</button>
      <button class="btn primary filter-btn" id="rail-done" type="button">Show results</button>
    </aside>
    <div class="sheet-backdrop" id="backdrop"></div>
    <section>
      <div class="toolbar">
        <span class="count" id="count"></span>
        <div class="active" id="active"></div>
        <button class="btn filter-btn" id="filter-btn" type="button" aria-expanded="false" aria-controls="rail">Filters</button>
      </div>
      <div id="featured"></div>
      <div class="grid" id="plugins"></div>
      <button class="btn more" id="more" type="button" hidden>Show more</button>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>Data: the Claude plugin directory and the GitHub API, rebuilt nightly. Plugins that live inside a shared repository show that repository's star count.</span>
      <span><a href="https://github.com/brunofitas">GitHub</a></span>
    </div>
  </footer>
  <script src="assets/site.js?v=4"></script>
</body>
</html>
